<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas Finanças</title>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 20px auto; padding: 0 10px; }
  input, button { padding: 8px; margin: 4px 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
  th { background: #f0f0f0; }
  a { color: #06c; cursor: pointer; text-decoration: underline; }
  small { color: #666; }
  .erro { color: red; }
</style>
</head>
<body>
<h1>Minhas Finanças</h1>

<div id="telaLogin">
  <h3>Entrar</h3>
  <input id="loginUser" placeholder="Usuário"><br>
  <input id="loginSenha" type="password" placeholder="Senha"><br>
  <button onclick="entrar()">Entrar</button>
  <p>Não tem conta? <a onclick="trocarTela('cadastro')">Criar conta</a></p>
  <p id="erroLogin" class="erro"></p>
</div>

<div id="telaCadastro" style="display:none">
  <h3>Criar conta</h3>
  <input id="cadUser" placeholder="Usuário (mín. 3, sem espaços)"><br>
  <input id="cadEmail" type="email" placeholder="Email (opcional)"><br>
  <small>O email servirá para recuperar a senha no futuro.</small><br>
  <input id="cadSenha" type="password" placeholder="Senha (mín. 6)"><br>
  <input id="cadSenha2" type="password" placeholder="Repetir senha"><br>
  <button onclick="cadastrar()">Criar conta</button>
  <p>Já tem conta? <a onclick="trocarTela('login')">Entrar</a></p>
  <p id="erroCadastro" class="erro"></p>
</div>

<div id="telaApp" style="display:none">
  <button onclick="sair()">Sair</button>
  <form id="form">
    <input id="texto" placeholder="Descrição (ex: água)" required>
    <input id="valor" type="number" step="0.01" placeholder="Valor" required>
    <button>Adicionar</button>
  </form>
  <table>
    <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th></tr></thead>
    <tbody id="corpo"></tbody>
  </table>
  <h3>Total: € <span id="total">0.00</span></h3>
</div>

<script>
const API_URL = "https://finan-as-pessoais-ia.onrender.com";
const $ = (id) => document.getElementById(id);

function trocarTela(tela) {
  $("telaLogin").style.display = tela === "login" ? "block" : "none";
  $("telaCadastro").style.display = tela === "cadastro" ? "block" : "none";
  $("telaApp").style.display = tela === "app" ? "block" : "none";
  $("erroLogin").textContent = "";
  $("erroCadastro").textContent = "";
}

function mostrar() {
  if (localStorage.getItem("token")) {
    trocarTela("app");
    carregarDespesas();
  } else {
    trocarTela("login");
  }
}

function sair() {
  localStorage.removeItem("token");
  mostrar();
}

async function chamar(caminho, opcoes = {}) {
  const r = await fetch(API_URL + caminho, {
    ...opcoes,
    headers: { "Content-Type": "application/json", "Authorization": localStorage.getItem("token") || "" },
  });
  if (r.status === 401 && localStorage.getItem("token")) { sair(); throw new Error("Sessão expirada"); }
  const dados = await r.json();
  if (!r.ok) throw new Error(dados.detail || "Erro");
  return dados;
}

async function enviarAcesso(caminho, corpo, idErro) {
  $(idErro).textContent = "A processar... (se demorar, o servidor está a acordar)";
  try {
    const dados = await chamar(caminho, { method: "POST", body: JSON.stringify(corpo) });
    localStorage.setItem("token", dados.token);
    mostrar();
  } catch (e) {
    $(idErro).textContent = e.message;
  }
}

function entrar() {
  enviarAcesso("/login", { login: $("loginUser").value, senha: $("loginSenha").value }, "erroLogin");
}

function cadastrar() {
  if ($("cadSenha").value !== $("cadSenha2").value) {
    $("erroCadastro").textContent = "As senhas não coincidem";
    return;
  }
  enviarAcesso("/registro", {
    login: $("cadUser").value,
    email: $("cadEmail").value,
    senha: $("cadSenha").value,
  }, "erroCadastro");
}

async function carregarDespesas() {
  try {
    const lista = await chamar("/despesas");
    $("corpo").innerHTML = "";
    let total = 0;
    for (const d of lista) {
      total += d.valor;
      const data = new Date(d.data_hora + "Z").toLocaleString("pt-PT");
      $("corpo").innerHTML += `<tr><td>${data}</td><td>${d.descricao}</td><td>${d.categoria}</td><td>${d.valor.toFixed(2)}</td></tr>`;
    }
    $("total").textContent = total.toFixed(2);
  } catch (e) { console.log(e); }
}

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  try {
    await chamar("/despesas", {
      method: "POST",
      body: JSON.stringify({ texto: $("texto").value, valor: parseFloat($("valor").value) }),
    });
    $("form").reset();
    carregarDespesas();
  } catch (e) { alert("Erro: " + e.message); }
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js");
mostrar();
</script>
</body>
</html>
