<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minhas Finanças</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 {
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
        }
        button {
            background-color: #2c7be5;
            color: white;
            border: none;
            cursor: pointer;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .total {
            font-weight: bold;
            text-align: right;
            margin-top: 10px;
        }
        table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}
th, td {
    text-align: left;
    padding: 8px;
    border-bottom: 1px solid #ddd;
}
th {
    background-color: #f0f0f0;
}
    </style>
</head>
<body>

    <h1>Minhas Finanças</h1>

    <form id="form-despesa">
        <input type="text" id="texto" placeholder="Descrição (ex: gastei 20 no mercado)" required>
        <input type="number" id="valor" step="0.01" placeholder="Valor (€)" required>
        <button type="submit">Adicionar despesa</button>
    </form>

    <table id="tabela-despesas">
        <thead>
            <tr>
                <th>Data</th>
                <th>Descrição</th>
                <th>Categoria</th>
                <th>Valor</th>
            </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
    </table>
    <div class="total" id="total"></div>
    <script>
        const API_URL = "https://finan-as-pessoais-ia.onrender.com/docs"

        async function carregarDespesas() {
    const resposta = await fetch(`${API_URL}/despesas`);
    const despesas = await resposta.json();

    const corpo = document.getElementById("corpo-tabela");
    corpo.innerHTML = "";

    let total = 0;
    despesas.forEach(d => {
        const linha = document.createElement("tr");
        const dataFormatada = new Date(d.data_hora).toLocaleDateString("pt-BR");
        linha.innerHTML = `
            <td>${dataFormatada}</td>
            <td>${d.descricao}</td>
            <td>${d.categoria}</td>
            <td>${d.valor.toFixed(2)}€</td>
        `;
        corpo.appendChild(linha);
        total += d.valor;
    });

    document.getElementById("total").textContent = `Total: ${total.toFixed(2)}€`;
}
    </script>

</body>
</html>
